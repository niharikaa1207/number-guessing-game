<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            margin-top: 100px;
            color: #333;
        }

        .box {
            background: white;
            padding: 30px;
            width: 320px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.03);
        }

        h2 {
            color: #4a4aef;
        }

        input {
            padding: 10px;
            width: 80px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #4a4aef;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #3333cc;
        }

        p {
            font-size: 18px;
            margin-top: 15px;
        }

        #result {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>🎯 Guess the Number</h2>
        <p>Guess a number between <b>1 and 10</b></p>

        <input type="number" id="guess">
        <br><br>
        <button onclick="check()">Guess</button>

        <p id="result"></p>
    </div>

    <script>
        let number = Math.floor(Math.random() * 10) + 1;

        function check() {
            let userGuess = document.getElementById("guess").value;

            if (userGuess == number) {
                document.getElementById("result").innerHTML = "Correct! You guessed it.";
                document.getElementById("result").style.color = "green";
            } else {
                document.getElementById("result").innerHTML = " Wrong! Try again.";
                document.getElementById("result").style.color = "red";
            }
        }
    </script>

</body>
</html>
